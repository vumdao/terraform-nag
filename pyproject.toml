[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tf-nag"
version = "0.1.0"
description = "Offline Terraform plan scanner for the tf-nag AWS Solutions rules"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/vumdao/terraform-nag.git"

[project.scripts]
tf-nag = "tfnag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tfnag"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
