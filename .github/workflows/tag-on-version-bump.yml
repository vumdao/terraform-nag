# Auto-tag a release when the version in pyproject.toml is bumped on master.
#
# On every push to master that touches pyproject.toml, read the project version
# and compare it against the highest existing `vX.Y.Z` git tag. If the new
# version is strictly higher and no matching tag exists yet, create and push the
# `vX.Y.Z` tag. That tag push is what triggers release.yml (which builds,
# publishes to PyPI, and cuts a GitHub Release).
name: tag-on-version-bump

on:
  push:
    branches:
      - master
    paths:
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tag-on-version-bump
  cancel-in-progress: false

jobs:
  tag:
    name: Tag if version bumped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so we can see every existing release tag.
          fetch-depth: 0
          # Push the tag with a PAT (not the default GITHUB_TOKEN) so the tag
          # push event is allowed to trigger release.yml. Pushes made with the
          # automatic GITHUB_TOKEN do not start new workflow runs.
          token: ${{ secrets.RELEASE_PAT }}

      - name: read_version
        id: version
        run: |
          set -euo pipefail
          version="$(grep -E '^version\s*=' pyproject.toml | head -n1 | sed -E 's/.*=\s*"([^"]+)".*/\1/')"
          if [ -z "$version" ]; then
            echo "Could not parse version from pyproject.toml" >&2
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version '$version' is not a plain X.Y.Z release version; skipping." >&2
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "Parsed version: $version"

      - name: check_and_tag
        if: steps.version.outputs.proceed == 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
          NEW_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          # Bail out if the tag already exists (locally or remotely).
          if git rev-parse -q --verify "refs/tags/${NEW_TAG}" >/dev/null; then
            echo "Tag ${NEW_TAG} already exists; nothing to do."
            exit 0
          fi

          # Find the highest existing vX.Y.Z tag using version-aware sort.
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)"

          if [ -z "$latest" ]; then
            echo "No existing release tags found; this is the first tag."
          else
            echo "Highest existing tag: v${latest}"
            # highest(latest, new) must equal new, and they must differ,
            # for new to be strictly greater.
            highest="$(printf '%s\n%s\n' "$latest" "$NEW_VERSION" \
              | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)"
            if [ "$NEW_VERSION" = "$latest" ]; then
              echo "Version ${NEW_VERSION} equals the latest tag; skipping."
              exit 0
            fi
            if [ "$highest" != "$NEW_VERSION" ]; then
              echo "::error::Version ${NEW_VERSION} is lower than latest tag v${latest}. Bump the version in pyproject.toml above v${latest}." >&2
              exit 1
            fi
          fi

          echo "Creating and pushing tag ${NEW_TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG}"
          git push origin "${NEW_TAG}"
